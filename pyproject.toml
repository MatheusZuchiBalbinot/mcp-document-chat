[project]
name = "mcp-document-chat"
version = "0.1.0"
description = "CLI chat with an MCP client and a document MCP server (Anthropic Academy MCP course)"
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "anthropic>=0.51.0,<1",
    "mcp[cli]>=1.8.0,<2",
    "prompt-toolkit>=3.0.51",
    "python-dotenv>=1.1.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
